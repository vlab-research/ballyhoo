# The smoke brief: the imagery pipeline end to end on real Pexels replies, small
# enough to run whenever the tool changes. Its review page is also where queries
# are tuned, by each query's keep rate. README.md § Smoke test has the commands.
#
# Photos come from stock and image models make drawings (docs/creative-rules.md),
# so three needs search Pexels for a photograph and the fourth, the one stock has
# never served, is drawn by Gemini on flat green, cut out, and previewed in the
# figure template. The searches are free; the drawings cost about $0.20 a run.
#
# The needs are regions, not countries. A person who reads as East African serves
# a Kenyan study and one who reads as North African or Arab a Moroccan one;
# naming the country returns documentary and tourist work and little else.
#
# The queries are the regional spike's best three a need, and one new one
# (2026-09-16; planning/phase-2-imagery.md § Spike results):
# - "middle aged" and "mature" found all but one of that spike's 33 fits, where
#   the age words that read as elderly found ethnographic portraits of people
#   well past the age ceiling;
# - an occupation with a place ("moroccan man shop owner") returns ordinary
#   people in their own settings;
# - negation backfires, so the unveiled need asks for short hair, which works;
# - each need's new query asks for more life than a posed portrait has, since a
#   photo that does not stop the scroll fails whatever else it does, and the
#   spike graded before that rule existed.
#
# One query carries orientation: square, the one Pexels filter worth having. It
# returns a different set from the same words and is the shape these templates
# want, so this run's keep rate for it can be read against the spike's for the
# same query unfiltered.
#
# Four queries of eight results a need: by the fourth most results repeat an
# earlier one, and twelve searches stay far inside Pexels's 200 requests an hour.

designs: designs

defaults:
  n: 8
  preview:
    templates: &band [photo-band/1080x1080]
    copy: Take a short survey and share *your views*.

# The styles the author draws in, quoted from docs/creative-rules.md § Drawing
# styles the author has used: their words, typos and all, less the subject each
# prompt named, which is what a need's subject line carries.
#
# The guards are not the author's, and neither is the second half of each
# framing line: they come from the drawing spike, where "technical drawing"
# became a blueprint with dimension lines, and a line drawing of a woman in
# Nairobi became a street scene with shop signs and real brand names
# (planning/phase-2-imagery.md § Spike results). Firefly needed neither.
# The framing keeps the figure inside the picture with green on both sides:
# arms drawn into a side edge are cut off in a straight line the ad shows, and
# leave no border to read the key from.
#
# The prompt spike is still tuning this wording. When it settles, these texts
# are what changes, and nothing else: a need names a style and a subject.
styles:
  precise-pastel:
    style: >-
      She's not pretty, her features are not the right proportions. Her eyes
      dont sit at exactly the same level, although close. Her eyebrows are
      bushy. Hair is cut stylishly, but not cut well. She would never be a
      model. The picture is hand draw, but extremely detailed, precise,
      accurate, not stylized...but in brilliant colors, which are stylized.
      - pastel palette.
    framing: >-
      She has her mobile phone in his hand, but she's looking off into the
      distance. We see her at an angle. One figure, waist up, inside the
      picture with green on both sides of her, cut off only by the bottom
      edge, and nothing else in the picture.
    guards: No lettering, signs, logos or brand names anywhere.
  bright-line:
    style: It should be a line drawing, brightly colored.
    framing: >-
      She should be on her mobile phone, but looking at us. One figure, waist
      up, inside the picture with green on both sides of her, cut off only by
      the bottom edge, and nothing else in the picture.
    guards: No lettering, signs, logos or brand names anywhere.
  bw-technical:
    style: I would like a hand-drawn technical drawing, black and white.
    guards: >-
      No dimension lines, measurements, labels or annotations: technical here
      is the hand-drawn look, not a blueprint.
  pencil-technical:
    style: >-
      An abstract technical line drawing. The image should be colored, brightly
      colored, as though with colored pencil.
    guards: >-
      No dimension lines, measurements, labels or annotations: technical here
      is the hand-drawn look, not a blueprint.

ea-woman:
  need: >-
    A woman who reads as East African, about 45 to 55. Judge first whether the
    photo stops the scroll. That is yours to judge by looking, not a list to
    score: the author's own picks are the reference, so look at
    scenes/kids-peeking.png and scenes/father-toddler-blanket.png in the art
    library before rating. Competently shot but bland is a drop. Then § Audience
    of docs/creative-rules.md: it has to look like a professional local ad, never
    a documentary, ethnographic or tourist photograph, and never a foreigner's
    idea of the place. The region is what matters, not the country: a Kenyan
    study is served by anyone who reads as East African. She need not be holding
    a phone.
  search:
    pexels:
      - middle aged african woman portrait smiling
      - african woman grey hair portrait
      - mature african woman phone
      # New: after an expression and a colour rather than a pose.
      - african woman laughing colourful portrait

na-man:
  need: >-
    A man who reads as North African or Arab, about 45 to 55. Judge first whether
    the photo stops the scroll. That is yours to judge by looking, not a list to
    score: the author's own picks are the reference, so look at
    scenes/kids-peeking.png and scenes/father-toddler-blanket.png in the art
    library before rating. Competently shot but bland is a drop. Then § Audience
    of docs/creative-rules.md: it has to look like a professional local ad, never
    a documentary, ethnographic or tourist photograph, and never a foreigner's
    idea of the place. The region is what matters, not the country: a Moroccan
    study is served by anyone who reads as North African or Arab. He need not be
    holding a phone.
  search:
    pexels:
      # The spike ran this query square against the API; square returned a
      # genuinely different set, so the two keep rates are comparable.
      - query: middle aged arab man portrait
        orientation: square
      - moroccan man shop owner
      - mature arab man phone cafe
      # New: the occupation-with-a-place pattern that found the spike's best photo.
      - mature arab man barber shop
  # French, not Arabic: the template's Hind has no Arabic glyphs, and a fallback font would pass unnoticed.
  preview:
    templates: *band
    copy: Répondez à une courte enquête et donnez *votre avis*.

# The hardest need in every spike: Pexels's Arab women of this age are veiled,
# young, or both, and its fits lean Levantine and Turkish. It stays so each run
# shows whether that is still true, and a drawing is expected to serve it.
na-woman:
  need: >-
    A woman who reads as North African or Arab, about 45 to 55, without a
    headscarf. Judge first whether the photo stops the scroll. That is yours to
    judge by looking, not a list to score: the author's own picks are the
    reference, so look at scenes/kids-peeking.png and
    scenes/father-toddler-blanket.png in the art library before rating.
    Competently shot but bland is a drop. Then § Audience of
    docs/creative-rules.md: it has to look like a professional local ad, never a
    documentary, ethnographic or tourist photograph, and never a foreigner's idea
    of the place. The region is what matters, not the country: a Moroccan study
    is served by anyone who reads as North African or Arab. She need not be
    holding a phone.
  search:
    pexels:
      - middle aged arab woman portrait
      - lebanese woman portrait
      - arab woman short hair portrait
      # New: candid and laughing, against the studio series the spike's fits came from.
      - arab woman laughing candid
  preview:
    templates: *band
    copy: Répondez à une courte enquête et donnez *votre avis*.

# The same person, drawn, since no catalogue has her: two images a run, so a
# drawing run costs about as much as a coffee and can be compared with the
# photographs above under the same need.
na-woman-drawn:
  need: >-
    A drawing of a woman who reads as North African or Arab, about 45 to 55,
    without a headscarf, in the house style: docs/creative-rules.md § Drawing
    styles the author has used, and the art in characters/ for what it looks
    like when it works. Judge the drawing first, by looking, as a photograph is
    judged. Then look at the cut-out beside it: a green edge, a fringe or a hole
    in the figure is a drop whatever the mask check said, and a mask check that
    failed is a warning to look closely, not a verdict.
  n: 2
  prompt_suffix: No text, letters or numbers anywhere in the image.
  generate:
    gemini:
      style: precise-pastel
      subject: A cool woman in her fifties from Casablanca, without a headscarf.
  preview:
    templates: [figure-band/1080x1080]
    copy: Répondez à une courte enquête et donnez *votre avis*.
