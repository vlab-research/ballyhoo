[project]
name = "ballyhoo"
version = "0.1.0"
description = "AI design studio for recruitment ads: change the copy, get checked creatives."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nandan Rao", email = "nandanmarkrao@gmail.com" }]
dependencies = [
    "numpy>=2",
    "pillow>=10",
    "playwright>=1.49",
    "pyyaml>=6",
    "scipy>=1.13",
]

[project.scripts]
ballyhoo = "ballyhoo.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
